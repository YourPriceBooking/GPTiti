name: Deploy GPTiti Production

on:
    push:
        branches:
            - main

env:
    PROJECT_NAME: GPTiti
    APP_DIR: /var/www/GPTiti
    RELEASES_DIR: /var/www/GPTiti/releases
    CURRENT_LINK: /var/www/GPTiti/current
    ECOSYSTEM: /var/www/GPTiti/ecosystem.config.js
    PORT: 3030

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            ################################################
            # TELEGRAM START
            ################################################

            - name: 🚀 Telegram START
              uses: appleboy/telegram-action@master
              with:
                  to: ${{ secrets.TELEGRAM_CHAT_ID }}
                  token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
                  message: |
                      🚀 DEPLOY STARTED

                      Project: ${{ env.PROJECT_NAME }}
                      Repo: ${{ github.repository }}
                      Branch: ${{ github.ref_name }}
                      Commit: ${{ github.sha }}
                      Actor: ${{ github.actor }}

            ################################################
            # DEPLOY
            ################################################

            - name: 🚀 Deploy via SSH
              uses: appleboy/ssh-action@v1.0.3
              env:
                  PROJECT_NAME: ${{ env.PROJECT_NAME }}
                  APP_DIR: ${{ env.APP_DIR }}
                  RELEASES_DIR: ${{ env.RELEASES_DIR }}
                  CURRENT_LINK: ${{ env.CURRENT_LINK }}
                  ECOSYSTEM: ${{ env.ECOSYSTEM }}
                  PORT: ${{ env.PORT }}
              with:
                  host: ${{ secrets.SERVER_HOST }}
                  username: root
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  script_stop: true
                  envs: PROJECT_NAME,APP_DIR,RELEASES_DIR,CURRENT_LINK,ECOSYSTEM,PORT
                  script: |

                      set -e

                      echo "Deploying $PROJECT_NAME"

                      mkdir -p $RELEASES_DIR

                      PREVIOUS_RELEASE=$(readlink -f $CURRENT_LINK || echo "")

                      NEW_RELEASE="$RELEASES_DIR/$(date +%Y%m%d_%H%M%S)"

                      echo "New release: $NEW_RELEASE"

                      ################################################
                      # CLONE
                      ################################################

                      git clone \
                        --depth 1 \
                        --branch main \
                        git@github.com:${{ github.repository }}.git \
                        $NEW_RELEASE

                      cd $NEW_RELEASE

                      ################################################
                      # INSTALL
                      ################################################

                      echo "Installing dependencies"
                      npm ci

                      ################################################
                      # BUILD
                      ################################################

                      echo "Building project"
                      npm run build

                      ################################################
                      # SWITCH RELEASE
                      ################################################

                      echo "Switch current → $NEW_RELEASE"
                      ln -sfn $NEW_RELEASE $CURRENT_LINK

                      ################################################
                      # PM2 RELOAD
                      ################################################

                      echo "Reload PM2"

                      pm2 reload $ECOSYSTEM --update-env || pm2 start $ECOSYSTEM

                      ################################################
                      # WAIT STARTUP
                      ################################################

                      echo "Wait startup"
                      sleep 10

                      ################################################
                      # HEALTHCHECK
                      ################################################

                      HEALTH_OK=0

                      for i in {1..20}; do

                        STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:$PORT || true)

                        echo "Healthcheck attempt $i → $STATUS"

                        if [ "$STATUS" = "200" ]; then

                          HEALTH_OK=1
                          break

                        fi

                        sleep 3

                      done

                      ################################################
                      # ROLLBACK IF FAILED
                      ################################################

                      if [ $HEALTH_OK -eq 0 ]; then

                        echo "Healthcheck failed → rollback"

                        if [ ! -z "$PREVIOUS_RELEASE" ]; then

                          ln -sfn $PREVIOUS_RELEASE $CURRENT_LINK

                          pm2 reload $ECOSYSTEM --update-env

                        fi

                        rm -rf $NEW_RELEASE

                        exit 1

                      fi

                      ################################################
                      # CLEAN OLD RELEASES (KEEP LAST 5)
                      ################################################

                      cd $RELEASES_DIR

                      ls -dt */ | tail -n +6 | xargs rm -rf || true

                      echo "Deploy success"

            ################################################
            # TELEGRAM SUCCESS
            ################################################

            - name: ✅ Telegram SUCCESS
              if: success()
              uses: appleboy/telegram-action@master
              with:
                  to: ${{ secrets.TELEGRAM_CHAT_ID }}
                  token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
                  message: |
                      ✅ DEPLOY SUCCESS

                      Project: ${{ env.PROJECT_NAME }}
                      Repo: ${{ github.repository }}
                      Commit: ${{ github.sha }}

                      Server: OK
                      Port: ${{ env.PORT }}

            ################################################
            # TELEGRAM FAILURE
            ################################################

            - name: ❌ Telegram FAILURE
              if: failure()
              uses: appleboy/telegram-action@master
              with:
                  to: ${{ secrets.TELEGRAM_CHAT_ID }}
                  token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
                  message: |
                      ❌ DEPLOY FAILED

                      Project: ${{ env.PROJECT_NAME }}
                      Repo: ${{ github.repository }}
                      Commit: ${{ github.sha }}

                      Check logs:
                      https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
