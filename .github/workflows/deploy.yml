name: Deploy GPTiti

on:
    push:
        branches:
            - main

env:
    PROJECT_NAME: GPTiti
    APP_DIR: /var/www/GPTiti
    RELEASES_DIR: /var/www/GPTiti/releases
    CURRENT_LINK: /var/www/GPTiti/current
    ECOSYSTEM: /var/www/GPTiti/ecosystem.config.js
    PORT: 3030

jobs:
    notify_start:
        runs-on: ubuntu-latest
        steps:
            - uses: appleboy/telegram-action@master
              with:
                  token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
                  to: ${{ secrets.TELEGRAM_CHAT_ID }}
                  message: |
                      🚀 DEPLOY STARTED

                      Project: ${{ env.PROJECT_NAME }}
                      Branch: ${{ github.ref_name }}
                      Commit: ${{ github.sha }}

    deploy:
        runs-on: ubuntu-latest
        needs: notify_start

        steps:
            - uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SERVER_HOST }}
                  username: root
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  script_stop: true

                  script: |

                      set -e

                      mkdir -p $RELEASES_DIR

                      PREVIOUS_RELEASE=$(readlink -f $CURRENT_LINK || echo "")

                      NEW_RELEASE="$RELEASES_DIR/$(date +%Y%m%d_%H%M%S)"

                      git clone \
                        --depth 1 \
                        --branch main \
                        git@github.com:${{ github.repository }}.git \
                        $NEW_RELEASE

                      cd $NEW_RELEASE

                      npm ci

                      npm run build

                      ln -sfn $NEW_RELEASE $CURRENT_LINK

                      pm2 reload $ECOSYSTEM --update-env

                      sleep 10

                      HEALTH_OK=0

                      for i in {1..20}; do

                        STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:$PORT || true)

                        if [ "$STATUS" = "200" ]; then

                          HEALTH_OK=1
                          break

                        fi

                        sleep 3

                      done

                      if [ $HEALTH_OK -eq 0 ]; then

                        if [ ! -z "$PREVIOUS_RELEASE" ]; then

                          ln -sfn $PREVIOUS_RELEASE $CURRENT_LINK

                          pm2 reload $ECOSYSTEM --update-env

                        fi

                        rm -rf $NEW_RELEASE

                        exit 1

                      fi

                      cd $RELEASES_DIR

                      ls -dt */ | tail -n +6 | xargs rm -rf || true

    notify_success:
        runs-on: ubuntu-latest
        needs: deploy
        if: success()

        steps:
            - uses: appleboy/telegram-action@master
              with:
                  token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
                  to: ${{ secrets.TELEGRAM_CHAT_ID }}
                  message: |
                      ✅ DEPLOY SUCCESS

                      Project: GPTiti
                      Commit: ${{ github.sha }}

    notify_failure:
        runs-on: ubuntu-latest
        needs: deploy
        if: failure()

        steps:
            - uses: appleboy/telegram-action@master
              with:
                  token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
                  to: ${{ secrets.TELEGRAM_CHAT_ID }}
                  message: |
                      ❌ DEPLOY FAILED

                      Project: GPTiti
                      Commit: ${{ github.sha }}
