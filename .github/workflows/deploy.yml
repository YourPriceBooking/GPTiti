name: Deploy GPTiti Production

on:
    push:
        branches:
            - main

env:
    PROJECT_NAME: GPTiti
    APP_DIR: /var/www/GPTiti
    RELEASES_DIR: /var/www/GPTiti/releases
    CURRENT_LINK: /var/www/GPTiti/current
    ECOSYSTEM: /var/www/GPTiti/ecosystem.config.js
    PORT: 3030
    PROJECT_SUBDIR: gpt-app

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            ################################################
            # TELEGRAM START
            ################################################

            - name: 🚀 Telegram START
              uses: appleboy/telegram-action@master
              with:
                  to: ${{ secrets.TELEGRAM_CHAT_ID }}
                  token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
                  message: |
                      🚀 DEPLOY STARTED

                      Project: GPTiti
                      Repo: ${{ github.repository }}
                      Commit: ${{ github.sha }}

            ################################################
            # DEPLOY
            ################################################

            - name: 🚀 Deploy via SSH
              uses: appleboy/ssh-action@v1.0.3
              env:
                  APP_DIR: ${{ env.APP_DIR }}
                  RELEASES_DIR: ${{ env.RELEASES_DIR }}
                  CURRENT_LINK: ${{ env.CURRENT_LINK }}
                  ECOSYSTEM: ${{ env.ECOSYSTEM }}
                  PORT: ${{ env.PORT }}
                  PROJECT_SUBDIR: ${{ env.PROJECT_SUBDIR }}
              with:
                  host: ${{ secrets.SERVER_HOST }}
                  username: root
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  script_stop: true
                  envs: APP_DIR,RELEASES_DIR,CURRENT_LINK,ECOSYSTEM,PORT,PROJECT_SUBDIR
                  script: |

                      set -e

                      mkdir -p $RELEASES_DIR

                      PREVIOUS_RELEASE=$(readlink -f $CURRENT_LINK || echo "")

                      NEW_RELEASE="$RELEASES_DIR/$(date +%Y%m%d_%H%M%S)"

                      echo "Cloning repo → $NEW_RELEASE"

                      git clone \
                        --depth 1 \
                        --branch main \
                        git@github.com:${{ github.repository }}.git \
                        $NEW_RELEASE

                      echo "Entering project directory"

                      cd $NEW_RELEASE/$PROJECT_SUBDIR

                      echo "Install dependencies"

                      npm install

                      echo "Build project"

                      npm run build

                      echo "Switch release"

                      ln -sfn $NEW_RELEASE/$PROJECT_SUBDIR $CURRENT_LINK

                      echo "Reload PM2"

                      pm2 reload $ECOSYSTEM --update-env || pm2 start $ECOSYSTEM

                      echo "Wait startup"

                      sleep 10

                      HEALTH_OK=0

                      for i in {1..20}; do

                        STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:$PORT || true)

                        echo "Healthcheck $i → $STATUS"

                        if [ "$STATUS" = "200" ]; then

                          HEALTH_OK=1
                          break

                        fi

                        sleep 3

                      done

                      if [ $HEALTH_OK -eq 0 ]; then

                        echo "Rollback"

                        if [ ! -z "$PREVIOUS_RELEASE" ]; then

                          ln -sfn $PREVIOUS_RELEASE $CURRENT_LINK

                          pm2 reload $ECOSYSTEM --update-env

                        fi

                        rm -rf $NEW_RELEASE

                        exit 1

                      fi

                      echo "Clean old releases"

                      cd $RELEASES_DIR

                      ls -dt */ | tail -n +6 | xargs rm -rf || true

                      echo "Deploy success"

            ################################################
            # TELEGRAM SUCCESS
            ################################################

            - name: ✅ Telegram SUCCESS
              if: success()
              uses: appleboy/telegram-action@master
              with:
                  to: ${{ secrets.TELEGRAM_CHAT_ID }}
                  token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
                  message: |
                      ✅ DEPLOY SUCCESS

                      Project: GPTiti
                      Commit: ${{ github.sha }}

            ################################################
            # TELEGRAM FAILURE
            ################################################

            - name: ❌ Telegram FAILURE
              if: failure()
              uses: appleboy/telegram-action@master
              with:
                  to: ${{ secrets.TELEGRAM_CHAT_ID }}
                  token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
                  message: |
                      ❌ DEPLOY FAILED

                      Project: GPTiti
                      Commit: ${{ github.sha }}
