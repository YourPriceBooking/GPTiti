name: Deploy GPTiti Frontend

on:
    push:
        branches:
            - main

env:
    PROJECT_NAME: GPTiti
    PROJECT_SUBDIR: gpt-app
    APP_DIR: /var/www/GPTiti
    RELEASES_DIR: /var/www/GPTiti/releases
    CURRENT_LINK: /var/www/GPTiti/current
    ECOSYSTEM: /var/www/GPTiti/ecosystem.config.js

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Notify Telegram START
              run: |
                  curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
                  -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
                  -d text="🚀 GPTiti deploy STARTED"

            - name: Deploy via SSH
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SERVER_HOST }}
                  username: root
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  script: |

                      set -e

                      echo "Starting deploy..."

                      TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
                      NEW_RELEASE=$RELEASES_DIR/$TIMESTAMP

                      echo "Creating release folder: $NEW_RELEASE"
                      mkdir -p $NEW_RELEASE

                      echo "Cloning repo..."
                      git clone --depth 1 https://github.com/${{ github.repository }} $NEW_RELEASE

                      echo "Checking project dir exists..."
                      if [ ! -f "$NEW_RELEASE/$PROJECT_SUBDIR/package.json" ]; then
                        echo "ERROR: package.json not found"
                        exit 1
                      fi

                      echo "Installing dependencies..."
                      cd $NEW_RELEASE/$PROJECT_SUBDIR
                      npm install

                      echo "Building project..."
                      npm run build || true

                      echo "Fixing current symlink safely..."

                      if [ -L "$CURRENT_LINK" ] || [ -d "$CURRENT_LINK" ]; then
                        rm -rf $CURRENT_LINK
                      fi

                      ln -sfn $NEW_RELEASE/$PROJECT_SUBDIR $CURRENT_LINK

                      echo "Verifying deploy..."

                      if [ ! -f "$CURRENT_LINK/package.json" ]; then
                        echo "ERROR: deploy verification failed"
                        exit 1
                      fi

                      echo "Restarting PM2..."

                      pm2 startOrRestart $ECOSYSTEM
                      pm2 save

                      echo "Cleaning old releases..."

                      cd $RELEASES_DIR
                      ls -dt */ | tail -n +6 | xargs -r rm -rf

                      echo "Deploy completed successfully"

            - name: Notify Telegram SUCCESS
              if: success()
              run: |
                  curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
                  -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
                  -d text="✅ GPTiti deploy SUCCESS"

            - name: Notify Telegram FAIL
              if: failure()
              run: |
                  curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
                  -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
                  -d text="❌ GPTiti deploy FAILED"
